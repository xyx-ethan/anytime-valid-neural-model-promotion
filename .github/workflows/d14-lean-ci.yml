name: D14 Lean witness verification

on:
  push:
    branches:
      - d14-lean-ci-20260905

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.1
          "$HOME/.elan/bin/elan" default leanprover/lean4:v4.33.1
          "$HOME/.elan/bin/lean" --version

      - name: Fetch pinned Formal Conjectures checkout
        shell: bash
        run: |
          set -euo pipefail
          FC="$RUNNER_TEMP/formal-conjectures"
          git init -q "$FC"
          git -C "$FC" remote add origin https://github.com/google-deepmind/formal-conjectures.git
          git -C "$FC" fetch -q --depth 1 origin 8323e878b83fcd7f4a448256069352a265460d75
          git -C "$FC" checkout -q --detach FETCH_HEAD
          test "$(git -C "$FC" rev-parse HEAD)" = "8323e878b83fcd7f4a448256069352a265460d75"
          cp "$GITHUB_WORKSPACE/d14-ci/D14ShortWitness.lean" "$FC/D14ShortWitness.lean"

      - name: Download Mathlib cache and compile OEIS dependency
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          FC="$RUNNER_TEMP/formal-conjectures"
          cd "$FC"
          lake exe cache get
          lake build FormalConjecturesUtil
          mkdir -p .lake/build/lib/lean/FormalConjectures/OEIS
          lake env lean \
            -o .lake/build/lib/lean/FormalConjectures/OEIS/51903.olean \
            FormalConjectures/OEIS/51903.lean
          test -s .lake/build/lib/lean/FormalConjectures/OEIS/51903.olean

      - name: Kernel-check standalone D14 witness and print axioms
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          FC="$RUNNER_TEMP/formal-conjectures"
          cd "$FC"
          lake env lean -o "$RUNNER_TEMP/D14ShortWitness.olean" D14ShortWitness.lean \
            2>&1 | tee "$RUNNER_TEMP/d14-lean.log"
          test -s "$RUNNER_TEMP/D14ShortWitness.olean"
          if grep -E 'sorryAx|Lean\.ofReduceBool|Lean\.trustCompiler' "$RUNNER_TEMP/d14-lean.log"; then
            echo 'Forbidden axiom found in standalone #print axioms output' >&2
            exit 3
          fi

      - name: Patch actual upstream conjecture3 in pinned checkout
        shell: bash
        run: |
          set -euo pipefail
          FC="$RUNNER_TEMP/formal-conjectures"
          export FC GITHUB_WORKSPACE RUNNER_TEMP
          python3 - <<'PY'
          from pathlib import Path
          import os

          fc = Path(os.environ['FC'])
          src = fc / 'FormalConjectures/OEIS/51903.lean'
          proof = Path(os.environ['GITHUB_WORKSPACE']) / 'd14-ci/D14ShortWitness.lean'
          text = src.read_text()
          ptext = proof.read_text()

          body = ptext.split('namespace D14.R5\n', 1)[1].split('\nend D14.R5', 1)[0]
          old = '''@[category research open, AMS 11]
          theorem conjecture3 :
              answer(sorry) ↔ ∃ n : ℕ, Odd n ∧ 1 < a n ∧ 2 ^ n ≡ 2 ^ (a n) [MOD n] := by
            sorry'''
          new_theorem = '''@[category research solved, AMS 11]
          theorem conjecture3 :
              answer(True) ↔ ∃ n : ℕ, Odd n ∧ 1 < a n ∧ 2 ^ n ≡ 2 ^ (a n) [MOD n] := by
            change True ↔ ∃ n : ℕ, Odd n ∧ 1 < a n ∧ 2 ^ n ≡ 2 ^ (a n) [MOD n]
            exact D14Proof.short_answer'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one conjecture3 block, found {text.count(old)}')

          # Preserve the original conjecture3 docstring immediately before the
          # category/theorem declaration.  The helper proof goes before it.
          theorem_pos = text.index(old)
          doc_pos = text.rfind('/--', 0, theorem_pos)
          if doc_pos < 0:
              raise SystemExit('could not locate conjecture3 docstring')
          helpers = '''set_option maxRecDepth 1000000
          set_option maxHeartbeats 0

          namespace D14Proof
          ''' + body + '''
          end D14Proof

          '''
          text = text[:doc_pos] + helpers + text[doc_pos:]
          text = text.replace(old, new_theorem, 1)
          text += '\n#print axioms OeisA51903.conjecture3\n'
          src.write_text(text)
          (Path(os.environ['RUNNER_TEMP']) / '51903-patched.lean').write_text(text)
          PY

      - name: Kernel-check patched OeisA51903.conjecture3 and audit axioms
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          FC="$RUNNER_TEMP/formal-conjectures"
          cd "$FC"
          rm -f .lake/build/lib/lean/FormalConjectures/OEIS/51903.olean
          lake env lean \
            -o "$RUNNER_TEMP/51903-patched.olean" \
            FormalConjectures/OEIS/51903.lean \
            2>&1 | tee "$RUNNER_TEMP/upstream-lean.log"
          test -s "$RUNNER_TEMP/51903-patched.olean"
          if grep -E "'OeisA51903\.conjecture3'.*(sorryAx|Lean\.ofReduceBool|Lean\.trustCompiler)|sorryAx|Lean\.ofReduceBool|Lean\.trustCompiler" "$RUNNER_TEMP/upstream-lean.log"; then
            echo 'Forbidden axiom found in patched conjecture3 audit' >&2
            exit 4
          fi
          grep -F "'OeisA51903.conjecture3' depends on axioms: [propext, Classical.choice, Quot.sound]" "$RUNNER_TEMP/upstream-lean.log"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d14-lean-verification
          path: |
            ${{ runner.temp }}/d14-lean.log
            ${{ runner.temp }}/D14ShortWitness.olean
            ${{ runner.temp }}/upstream-lean.log
            ${{ runner.temp }}/51903-patched.lean
            ${{ runner.temp }}/51903-patched.olean
          if-no-files-found: warn
